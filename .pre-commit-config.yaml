# Local entry point for the same ruff/mypy checks CI runs.
# Requires an active environment: pip install -e ".[dev]"
# (pre-commit is omitted on Python 3.8 so the CI matrix still installs [dev].)

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: python -m ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
