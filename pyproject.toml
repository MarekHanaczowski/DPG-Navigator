[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpg-navigator"
dynamic = ["version"]
description = "File dialog with rich preview panel for DearPyGui — images, PDF, Word, Excel, code highlighting, archives, and more"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "HACE" }]
keywords = ["dearpygui", "file-dialog", "gui", "file-picker", "navigator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "dearpygui>=1.9.1",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
preview = ["Pillow>=9.0"]
pdf = ["pypdfium2>=4.0", "numpy>=1.24", "Pillow>=9.0"]
word = ["python-docx>=0.8", "mammoth>=1.6", "html2image>=2.0", "numpy>=1.24", "Pillow>=9.0"]
pptx = ["python-pptx>=0.6.23", "Pillow>=9.0"]
html = ["html2image>=2.0", "numpy>=1.24", "Pillow>=9.0"]
markdown = ["markdown>=3.4", "html2image>=2.0", "numpy>=1.24", "Pillow>=9.0"]
excel = ["openpyxl>=3.0"]
archive = ["py7zr>=0.20.0"]
code = ["Pygments>=2.15.0", "html2image>=2.0", "numpy>=1.24", "Pillow>=9.0"]
all = [
    "Pillow>=9.0",
    "pypdfium2>=4.0",
    "numpy>=1.24",
    "python-docx>=0.8",
    "mammoth>=1.6",
    "html2image>=2.0",
    "python-pptx>=0.6.23",
    "markdown>=3.4",
    "openpyxl>=3.0",
    "py7zr>=0.20.0",
    "Pygments>=2.15.0",
]
dev = [
    "pytest>=7.0",
    "pytest-github-actions-annotate-failures>=0.2",
    "ruff>=0.6",
    "mypy>=1.10",
    "dpg-navigator[all]",
]

[project.urls]
Homepage = "https://github.com/MarekHanaczowski/dpg-navigator"
Repository = "https://github.com/MarekHanaczowski/dpg-navigator"

[tool.hatch.version]
source = "regex"
path = "dpg_navigator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dpg_navigator"]
exclude = ["dpg_navigator/tests/"]

[tool.hatch.build.targets.sdist]
include = [
    "dpg_navigator/",
    "benchmarks/",
    "docs/",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]
exclude = ["dpg_navigator/tests/"]

[tool.pytest.ini_options]
testpaths = ["dpg_navigator/tests"]
addopts = "--basetemp=.pytest_tmp"
cache_dir = ".pytest_tmp_cache"
markers = [
    "integration: real-DearPyGui tests; opt-in, need a display (set DPG_INTEGRATION=1)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Start with correctness checks that can be enforced on the existing codebase.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

# numpy's bundled stubs use PEP 695 `type` aliases, which fail to parse under
# the 3.10 target on the newer numpy that installs on Python 3.12/3.13 runners.
# numpy is an optional dependency used loosely (Any), so skip its stubs.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
