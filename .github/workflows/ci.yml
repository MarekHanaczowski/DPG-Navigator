name: CI

on:
  # Only main pushes: feature-branch commits are validated via their PR, so
  # "push:" without a filter no longer double-runs every PR-branch commit.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Full Python range on Linux — cheap, runs on every push and PR.
    name: Python ${{ matrix.python-version }} on ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      # Pin to commit SHA (not floating tags) for supply-chain integrity.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check package
        if: ${{ matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
        run: python -m mypy

      - name: Test
        if: ${{ matrix.python-version != '3.13' }}
        run: python -m pytest -q

      - name: Test with coverage
        if: ${{ matrix.python-version == '3.13' }}
        run: python -m pytest -q --cov=dpg_navigator --cov-report=term-missing

  test-cross-platform:
    # Windows (2x) and macOS (10x) are the expensive runners. A push to main
    # re-validates a commit the pull_request run already covered, so skip these
    # legs there; they still run on every PR (pre-merge gate) and on
    # release/workflow_call. Version endpoints only (where platform code lives).
    if: github.event_name != 'push'
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.8" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check package
        if: ${{ matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

  integration:
    # Real DearPyGui needs a display. xvfb + software GL is the Linux stand-in.
    name: DearPyGui smoke (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install xvfb and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libgl1 libglib2.0-0 libxkbcommon0 libegl1

      # html2image needs a real Chrome/Chromium, not the Ubuntu snap stub.
      - name: Install Chrome for HTML preview smoke
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      # html2image uses Chrome's ``--screenshot`` CLI (old headless). Full
      # Chrome for Testing hangs on that path; chrome-headless-shell is the
      # matching binary from Chrome for Testing.
      - name: Install chrome-headless-shell
        env:
          CHROME_VERSION: ${{ steps.setup-chrome.outputs.chrome-version }}
        run: |
          set -euo pipefail
          ver=$(echo "$CHROME_VERSION" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          dest="${RUNNER_TEMP}/chrome-headless-shell"
          mkdir -p "$dest"
          curl -fsSL -o "${RUNNER_TEMP}/chrome-headless-shell.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${ver}/linux64/chrome-headless-shell-linux64.zip"
          unzip -q "${RUNNER_TEMP}/chrome-headless-shell.zip" -d "$dest"
          bin=$(find "$dest" -type f -name chrome-headless-shell | head -n 1)
          test -n "$bin"
          chmod +x "$bin"
          echo "DPG_CHROME_BIN=${bin}" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Integration smoke
        env:
          DPG_INTEGRATION: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          DPG_CHROME_NO_SANDBOX: "1"
        run: xvfb-run -a python -m pytest -m integration -q --tb=short

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: surfaces known CVEs in the dependency tree without
    # blocking the build, since a new advisory in a transitive dep should
    # not fail unrelated work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install pip-audit

      - name: Audit dependencies
        run: python -m pip_audit

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and CycloneDX
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: |
          python -m cyclonedx_py environment --of JSON -o sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
