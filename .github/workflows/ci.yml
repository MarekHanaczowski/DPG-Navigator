name: CI

on:
  # Only main pushes: feature-branch commits are validated via their PR, so
  # "push:" without a filter no longer double-runs every PR-branch commit.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Full Python range on Linux — cheap, runs on every push and PR.
    name: Python ${{ matrix.python-version }} on ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      # Pin to commit SHA (not floating tags) for supply-chain integrity.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check package
        if: ${{ matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
        run: python -m mypy

      - name: Test
        if: ${{ matrix.python-version != '3.13' }}
        run: python -m pytest -q

      - name: Test with coverage
        if: ${{ matrix.python-version == '3.13' }}
        run: python -m pytest -q --cov=dpg_navigator --cov-report=term-missing

  test-cross-platform:
    # Windows (2x) and macOS (10x) are the expensive runners. A push to main
    # re-validates a commit the pull_request run already covered, so skip these
    # legs there; they still run on every PR (pre-merge gate) and on
    # release/workflow_call. Version endpoints only (where platform code lives).
    if: github.event_name != 'push'
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.8" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check package
        if: ${{ matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

  integration:
    # Real DearPyGui needs a display. xvfb + software GL is the Linux stand-in;
    # import can still segfault in a sandboxed runner, so this job is
    # informational and must not block the unit-test gate.
    name: DearPyGui smoke (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install xvfb and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libgl1 libglib2.0-0 libxkbcommon0 libegl1

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Integration smoke
        run: |
          xvfb-run -a env DPG_INTEGRATION=1 LIBGL_ALWAYS_SOFTWARE=1 \
            python -m pytest -m integration -q --tb=short

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: surfaces known CVEs in the dependency tree without
    # blocking the build, since a new advisory in a transitive dep should
    # not fail unrelated work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install pip-audit

      - name: Audit dependencies
        run: python -m pip_audit

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and CycloneDX
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install cyclonedx-bom

      - name: Generate CycloneDX SBOM
        run: |
          python -m cyclonedx_py environment --of JSON -o sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
