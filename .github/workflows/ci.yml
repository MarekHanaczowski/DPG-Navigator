name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Economical coverage: full Python range on Linux, version endpoints
        # on Windows (where the platform-specific code lives), a macOS smoke.
        include:
          - { os: ubuntu-latest, python-version: "3.8" }
          - { os: ubuntu-latest, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.8" }
          - { os: windows-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Type check pure modules
        # mypy cannot target 3.8, and the numpy that installs on 3.8/3.9 ships
        # stubs newer mypy can't parse under those targets. Type-check on
        # 3.10+; runtime compatibility on 3.8/3.9 is covered by the test run.
        if: ${{ matrix.python-version != '3.8' && matrix.python-version != '3.9' }}
        run: >-
          python -m mypy
          dpg_navigator/_types.py
          dpg_navigator/_filesystem.py
          dpg_navigator/_platform.py
          dpg_navigator/_icons.py
          dpg_navigator/_styles.py
          dpg_navigator/_keyboard.py
          dpg_navigator/_preview_registry.py
          dpg_navigator/_preview_table.py
          dpg_navigator/_preview_archive.py
          dpg_navigator/_preview_spreadsheet.py
          dpg_navigator/_preview_sqlite.py
          dpg_navigator/_preview_word.py
          dpg_navigator/_preview_presentation.py
          dpg_navigator/_preview.py
          dpg_navigator/_dialog.py
          dpg_navigator/_pdf.py
          dpg_navigator/_html.py

      - name: Test
        run: python -m pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Informational: surfaces known CVEs in the dependency tree without
    # blocking the build, since a new advisory in a transitive dep should
    # not fail unrelated work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install pip-audit

      - name: Audit dependencies
        run: python -m pip_audit
