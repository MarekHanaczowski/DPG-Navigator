name: CI

on:
  # Only main pushes: feature-branch commits are validated via their PR, so
  # "push:" without a filter no longer double-runs every PR-branch commit.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_call:
  # Deliberate manual entry point: the macOS leg below no longer runs on
  # pull requests, so this is how to order a full cross-platform pass on a
  # branch before merging, when a change actually touches platform code.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Full Python range on Linux — cheap, runs on every push and PR.
    name: Python ${{ matrix.python-version }} on ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      # Pin to commit SHA (not floating tags) for supply-chain integrity.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check package
        if: ${{ matrix.python-version != '3.9' }}
        run: python -m mypy

      - name: Test
        if: ${{ matrix.python-version != '3.13' }}
        run: python -m pytest -q

      - name: Test with coverage
        if: ${{ matrix.python-version == '3.13' }}
        run: python -m pytest -q --cov=dpg_navigator --cov-report=term-missing

  test-cross-platform:
    # Windows (2x) is the expensive-but-affordable runner: both legs still run
    # on every PR (pre-merge signal) and on release/workflow_call, and skip
    # the redundant re-run on a push to main. The macOS leg (10x multiplier)
    # moved to the dedicated ``test-macos`` job below, which runs post-merge
    # instead of per PR iteration -- owner directive of 2026-08-23 to limit
    # hosted-minute burn. Version endpoints only (where platform code lives).
    if: github.event_name != 'push'
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, python-version: "3.9" }
          - { os: windows-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check package
        if: ${{ matrix.python-version != '3.9' }}
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

  test-macos:
    # macOS carries a 10x Actions-minutes multiplier -- in August it consumed
    # more of the account's included pool than every Linux job in this repo
    # combined. The leg therefore runs once per merged change (push to main),
    # on releases (workflow_call) and on demand (workflow_dispatch), never per
    # PR iteration. Trade-off stated, not hidden: a macOS-specific regression
    # surfaces on main after the merge instead of blocking the PR.
    if: github.event_name != 'pull_request'
    name: Python 3.13 on macos-latest (post-merge)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check package
        run: python -m mypy

      - name: Test
        run: python -m pytest -q

  integration:
    # Real DearPyGui needs a display. xvfb + software GL is the Linux stand-in.
    name: DearPyGui smoke (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install xvfb and software GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libgl1-mesa-dri libgl1 libglib2.0-0 libxkbcommon0 libegl1

      # html2image needs a real Chrome/Chromium, not the Ubuntu snap stub.
      - name: Install Chrome for HTML preview smoke
        id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4  # v2.2.0
        with:
          chrome-version: stable
          install-dependencies: true

      # html2image uses Chrome's ``--screenshot`` CLI (old headless). Full
      # Chrome for Testing hangs on that path; chrome-headless-shell is the
      # matching binary from Chrome for Testing.
      - name: Install chrome-headless-shell
        env:
          CHROME_VERSION: ${{ steps.setup-chrome.outputs.chrome-version }}
        run: |
          set -euo pipefail
          ver=$(echo "$CHROME_VERSION" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
          dest="${RUNNER_TEMP}/chrome-headless-shell"
          mkdir -p "$dest"
          curl -fsSL -o "${RUNNER_TEMP}/chrome-headless-shell.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/${ver}/linux64/chrome-headless-shell-linux64.zip"
          python - <<'PY'
          import hashlib, os, sys
          path = os.environ["RUNNER_TEMP"] + "/chrome-headless-shell.zip"
          size = os.path.getsize(path)
          if size < 5_000_000:
              raise SystemExit(f"chrome-headless-shell zip too small: {size}")
          digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
          print(f"chrome-headless-shell sha256={digest} size={size}")
          PY
          unzip -t "${RUNNER_TEMP}/chrome-headless-shell.zip"
          unzip -q "${RUNNER_TEMP}/chrome-headless-shell.zip" -d "$dest"
          bin=$(find "$dest" -type f -name chrome-headless-shell | head -n 1)
          test -n "$bin"
          chmod +x "$bin"
          echo "DPG_CHROME_BIN=${bin}" >> "$GITHUB_ENV"
          "$bin" --version

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Integration smoke
        env:
          DPG_INTEGRATION: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          DPG_CHROME_NO_SANDBOX: "1"
        run: xvfb-run -a python -m pytest -m integration -q --tb=short

  audit:
    name: Dependency audit
    # Informational audit; keep it on main/manual and out of every PR run.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Informational: surfaces known CVEs in the dependency tree without
    # blocking the build, since a new advisory in a transitive dep should
    # not fail unrelated work.
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "pip-audit==2.10.0"

      - name: Audit dependencies
        run: python -m pip_audit

  sbom:
    name: Generate SBOM
    # SBOM is a post-merge/release artifact, not a PR gate.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and CycloneDX
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"
          python -m pip install "cyclonedx-bom==6.1.1"

      - name: Generate CycloneDX SBOM
        run: |
          python -m cyclonedx_py environment --of JSON -o sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
